name: Build & Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Auth to GCP
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Build & Push image
        run: |
          gcloud auth configure-docker europe-west1-docker.pkg.dev
          docker build -t europe-west1-docker.pkg.dev/${{ secrets.GCP_PROJECT }}/api/go-api:${{ github.sha }} ./app
          docker push europe-west1-docker.pkg.dev/${{ secrets.GCP_PROJECT }}/api/go-api:${{ github.sha }}

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v3
        with:
          cluster_name: observability-cluster
          location: europe-west1

      - name: Deploy to GKE
        run: |
          kubectl set image deployment/go-api go-api=europe-west1-docker.pkg.dev/${{ secrets.GCP_PROJECT }}/api/go-api:${{ github.sha }}

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/go-api --timeout=120s

      - name: Get pod status
        run: |
          echo "### Pod Status" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          kubectl get pods -l app=go-api -o wide >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      - name: Query Prometheus metrics
        run: |
          kubectl port-forward svc/monitoring-kube-prometheus-stack-prometheus 9090:9090 -n monitoring &
          sleep 5

          REQUESTS=$(curl -s "http://localhost:9090/api/v1/query?query=sum(http_requests_total)" \
            | jq -r '.data.result[0].value[1] // "0"')

          RATE=$(curl -s "http://localhost:9090/api/v1/query?query=round(rate(http_requests_total[5m]),0.01)" \
            | jq -r '.data.result[0].value[1] // "0"')

          RESTARTS=$(curl -s "http://localhost:9090/api/v1/query?query=kube_pod_container_status_restarts_total{pod=~'go-api.*'}" \
            | jq -r '.data.result[0].value[1] // "0"')

          echo "### App Metrics" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Total HTTP Requests | $REQUESTS |" >> $GITHUB_STEP_SUMMARY
          echo "| Request Rate (5m) | $RATE req/s |" >> $GITHUB_STEP_SUMMARY
          echo "| Pod Restarts | $RESTARTS |" >> $GITHUB_STEP_SUMMARY

      - name: Check deployment health
        run: |
          READY=$(kubectl get deployment go-api -o jsonpath='{.status.readyReplicas}')
          DESIRED=$(kubectl get deployment go-api -o jsonpath='{.spec.replicas}')

          echo "### Deployment Health" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Ready Replicas | $READY / $DESIRED |" >> $GITHUB_STEP_SUMMARY
          echo "| Image | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Deployed at | $(date -u) |" >> $GITHUB_STEP_SUMMARY

          if [ "$READY" != "$DESIRED" ]; then
            echo "Not all replicas are ready"
            exit 1
          fi          
